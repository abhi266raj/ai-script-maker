name: Code-completed labeling

# The "code completed" tag marks work merged into develop that is awaiting
# the release. Triage view = open issues WITHOUT the tag:
#   is:issue is:open -label:"code completed"
#
# 1. When a PR is squash-merged into develop, tag the PR "code completed"
#    AND tag every open issue it references (#N in title/body) — so the
#    fixed bug drops out of the triage view. (Fixer PRs must reference
#    their issue number in the body.)
# 2. When the same bug is reported again, remove the tag — the work
#    wasn't actually complete. That covers both shapes of "again":
#      - an issue REOPENED (finds PRs that referenced it via Closes #N), and
#      - a new issue whose title/body says "reopen" and names the PR or
#        issue (e.g. "PR #272", "see #271").
# (Issues stay open until the v1.7 release PR to main closes them.)
#
# NOTE: `pull_request_target` runs execute THIS FILE from the default branch
# (`main`), not from the PR base. Permission changes here take effect only
# after this file is merged to `main` (via a release).

on:
  pull_request_target:
    types: [closed]
    branches: [develop]
  issues:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  label-merged:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Add "code completed" label to PR and its issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          gh label create "code completed" \
            --color "0E8A16" \
            --description "Fix merged into develop; awaiting release" \
            --repo "$REPO" 2>/dev/null || true
          gh pr edit "$PR" --add-label "code completed" --repo "$REPO"

          # Tag every open issue the PR references, so it leaves the triage view.
          # (Title/body arrive via env: to avoid script-injection syntax errors.)
          TITLE="$PR_TITLE"
          BODY="$PR_BODY"
          CANDS=$(printf '%s\n%s' "$TITLE" "$BODY" | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
          for N in $CANDS; do
            [ "$N" = "$PR" ] && continue
            # gh issue view fails for PR numbers — only real issues pass.
            # (The boolean must come from inside the --jq expression: gh
            # parses `-e`/`-r` after --jq as its own arguments and errors.)
            if [ "$(gh issue view "$N" --repo "$REPO" --json state --jq '.state == "OPEN"' 2>/dev/null)" = "true" ]; then
              if gh issue edit "$N" --repo "$REPO" --add-label "code completed"; then
                echo "Tagged issue #$N as code completed (via PR #$PR)"
              else
                echo "::error::Failed to add 'code completed' to issue #$N (via PR #$PR)"
                exit 1
              fi
            fi
          done

  unlabel-reopened:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Remove "code completed" where the bug came back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          REPO="${{ github.repository }}"
          # (Event fields arrive via env: to avoid script-injection syntax errors.)
          ISSUE="$ISSUE_NUMBER"
          ACTION="$ISSUE_ACTION"
          TITLE="$ISSUE_TITLE"
          BODY="$ISSUE_BODY"

          # The issue itself loses the tag — a new report means the work wasn't complete.
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "code completed" 2>/dev/null || true

          # PRs that claimed the fix lose it too.
          PRS=""
          if [ "$ACTION" = "reopened" ]; then
            # PRs that referenced this issue (e.g. via "Closes #N" in the body)
            PRS=$(gh api "repos/$REPO/issues/$ISSUE/timeline" --paginate \
              -q '[.[] | select(.event=="cross-referenced") | .source.issue | select(.pull_request != null) | .number] | unique | .[]' 2>/dev/null || true)
          fi
          case "$TITLE $BODY" in
            *[Rr][Ee][Oo][Pp][Ee][Nn]*)
              PRS=$(printf '%s\n%s\n%s' "$PRS" "$TITLE" "$BODY" | grep -oiE '(PR|pull request) #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
              ;;
          esac
          for PR in $PRS; do
            if [ "$(gh pr view "$PR" --repo "$REPO" --json state,baseRefName \
                 --jq '.state == "MERGED" and .baseRefName == "develop"' 2>/dev/null)" = "true" ]; then
              gh pr edit "$PR" --repo "$REPO" --remove-label "code completed" \
                && echo "Removed 'code completed' from PR #$PR (bug #$ISSUE reported again)"
            fi
          done

          # Open issues named in a "reopen" report lose the tag as well
          # (e.g. a new issue saying "reopened, see #271").
          case "$TITLE $BODY" in
            *[Rr][Ee][Oo][Pp][Ee][Nn]*)
              for N in $(printf '%s\n%s' "$TITLE" "$BODY" | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true); do
                [ "$N" = "$ISSUE" ] && continue
                if [ "$(gh issue view "$N" --repo "$REPO" --json state --jq '.state == "OPEN"' 2>/dev/null)" = "true" ]; then
                  gh issue edit "$N" --repo "$REPO" --remove-label "code completed" 2>/dev/null \
                    && echo "Removed 'code completed' from issue #$N (reported again in #$ISSUE)"
                fi
              done
              ;;
          esac
