# ──────────────────────────────────────────────────────────────────────
# Test Suite — runs on PRs targeting main (e.g. the v1.7 release PR)
# ──────────────────────────────────────────────────────────────────────
# Blocks the merge if any test fails. Uses the pinned requirements so
# the CI environment matches the local venv.
# ──────────────────────────────────────────────────────────────────────
name: Test Suite

on:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q
