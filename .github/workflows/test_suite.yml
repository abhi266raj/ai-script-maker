# ──────────────────────────────────────────────────────────────────────
# Test Suite
# ──────────────────────────────────────────────────────────────────────
# - PRs targeting main: tests run automatically and block the merge.
# - Manual (Actions → Test Suite → Run workflow): pick the branch and
#   whether to run the suite. Default is NO — develop pushes never
#   trigger tests on their own; opt in manually when you want a run.
# ──────────────────────────────────────────────────────────────────────
name: Test Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to test'
        required: true
        default: 'develop'
      run_tests:
        description: 'Run the test suite'
        required: true
        default: false
        type: boolean

jobs:
  pytest:
    if: ${{ github.event_name == 'pull_request' || inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q
